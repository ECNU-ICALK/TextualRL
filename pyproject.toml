[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textualrl"
version = "0.1.0"
description = "TextualRL: context-space policy optimization with groupwise critique and cross-group evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "docs/licenses/*.txt"]
keywords = ["agent", "context-optimization", "textual-reinforcement-learning", "LLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.66.0",
    "PyYAML>=6.0",
    "json-repair>=0.61.0",
]

[project.optional-dependencies]
searchqa = ["datasets>=2.18.0"]
spreadsheetbench = ["openpyxl>=3.1.0", "pandas>=2.0"]
officeqa = []
docvqa = []
livemathematicianbench = []
alfworld = ["alfworld>=0.4.0", "gymnasium>=0.29.0", "numpy>=1.24.0", "omegaconf>=2.3.0"]
benchmarks = [
    "datasets>=2.18.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0",
    "alfworld>=0.4.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "omegaconf>=2.3.0",
]
azure = ["azure-identity>=1.15.0"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.4.0"]

[project.scripts]
textualrl = "textualrl.cli:main"

[tool.setuptools.packages.find]
include = ["textualrl", "textualrl.*", "skillopt", "skillopt.*", "scripts"]

[tool.setuptools.package-data]
skillopt = [
    "prompts/*.md",
    "envs/*/prompts/*.md",
    "envs/*/skills/*.md",
    "envs/*/vendor/*.yaml",
    "envs/_template/*.yaml",
    "envs/_template/*.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
